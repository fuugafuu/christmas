<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="クリスマスのメッセージを投稿・閲覧できるサイト。ログイン不要。"><meta name="theme-color" content="#102d29">
<meta property="og:title" content="Snowletter — みんなのクリスマス"><meta property="og:image" content="https://christmas-gray-iota.vercel.app/social-card.svg">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/site.css?v=2.0.0">
<script defer src="/site.js?v=2.0.0"></script><title>みんなの投稿 | Snowletter</title></head>
<body data-page="messages">
<div id="snow" class="snow" aria-hidden="true"></div><header class="site-header"><div class="shell header-inner">
<a class="brand" href="/"><span class="brand-icon">✳</span><span>Snowletter<small>CHRISTMAS 2026</small></span></a>
<button type="button" id="menuToggle" class="menu-toggle" aria-label="メニュー" aria-controls="nav" aria-expanded="false">☰</button>
<nav id="nav" class="main-nav" aria-label="メインナビゲーション"><a href="/" >ホーム</a><a href="/messages.html" aria-current="page">みんなの投稿</a><a href="/write.html" >投稿する</a><a href="/mine.html" >自分の投稿</a><a href="/countdown.html" >カウントダウン</a></nav></div></header>
<main id="main"><div class="page-head shell"><span class="eyebrow">MESSAGE WALL</span><h1>みんなのメッセージ</h1><p>気になる投稿に「光」を贈れます。</p></div>
<section class="shell feed-shell"><div class="filter-bar"><label class="search"><span>⌕</span><input id="wishSearch" type="search" maxlength="60" placeholder="名前や言葉で検索" aria-label="名前やメッセージで検索"></label>
<select id="sort" aria-label="並び順"><option value="new">新着順</option><option value="popular">光が多い順</option></select><select id="style" aria-label="カードの色"><option value="all">すべての色</option><option value="cranberry">赤</option><option value="fir">緑</option><option value="snow">白</option><option value="midnight">夜空</option></select></div>
<div class="feed-status"><span id="feedStatus">読み込み中…</span><button id="refreshWishes" type="button">↻ 更新</button></div><div id="wishGrid" class="cards"></div><div class="load-area"><button id="loadMore" class="btn ghost" type="button" hidden>もっと見る ↓</button></div></section></main>
<footer class="site-footer"><div class="shell footer-inner"><a href="/" class="brand">✳ Snowletter</a><span>クリスマスのひとことを、気軽に。</span><small>© 2026 Snowletter</small></div></footer>
<dialog id="reportDialog" class="dialog"><button id="closeReport" class="dialog-close" aria-label="閉じる" type="button">×</button><h2>投稿を報告</h2><p>不適切な投稿があった場合にお知らせください。</p>
<label for="reportReason">理由</label><select id="reportReason"><option value="spam">広告・宣伝</option><option value="inappropriate">不適切な内容</option><option value="personal_info">個人情報</option><option value="other">その他</option></select>
<button id="submitReport" class="btn primary" type="button">報告する</button></dialog><div id="toast" role="status" aria-live="polite" class="toast"></div></body></html>
